name: shoperic
description: >-
  Shoperic mobile app - a Flutter storefront for the Shoperic e-commerce
  platform (products, cart, wishlist, coupons, addresses and orders).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Networking
  http: ^1.2.0
  # State management
  provider: ^6.1.2
  # Images
  cached_network_image: ^3.3.1
  # Formatting (Indian rupee grouping, dates)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
